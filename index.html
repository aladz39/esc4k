<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Relax Beach</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    position:relative;
}

/* «·’Ê—… */
.bg{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;
}

/* “— «·—«»ÿ */
.click-btn{
    position:fixed;

    left:50%;
    top:42%;

    transform:translate(-50%,-50%);

    padding:14px 32px;

    background:rgba(0,0,0,0.45);
    color:#fff;

    text-decoration:none;

    font-family:Arial,sans-serif;
    font-size:18px;
    font-weight:bold;

    border:1px solid rgba(255,255,255,0.8);
    border-radius:30px;

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    box-shadow:0 5px 20px rgba(0,0,0,0.4);

    z-index:10;

    white-space:nowrap;
}

.click-btn:hover{
    background:rgba(255,255,255,0.2);
    transform:translate(-50%,-50%) scale(1.05);
}

</style>
</head>

<body>

<!-- «·’Ê—… -->
<img
    class="bg"
    src="beach_relax_4k.gif"
    alt="Relaxing beach with tent and campfire"
>

<!-- «·—«»ÿ -->
<a
    href="https://aladz39.github.io/esc8k/"
    target="_blank"
    rel="noopener noreferrer"
    class="click-btn">
    Click Here
</a>

</body>
</html>
